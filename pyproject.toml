[project]
name = "forgerca"
version = "0.0.0"
description = "Evidence-grounded industrial fault diagnosis (initialization stage)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
# M1-07: PDF layout and table parsing; other runtime dependencies arrive later.
dependencies = [
    "docling==2.142.0",
    # Direct declarations let uv apply the CPU indexes below to Docling's backend.
    "torch>=2.2.2,<3",
    "torchvision<1",
]

[dependency-groups]
# Development-only tooling. Runtime code must not import these.
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "rust-just==1.58.0",
]

[tool.uv]
# This repository is an application and a set of scripts, not a distributable
# library: there is no build backend and nothing to install as a package.
package = false

# Use CPU builds for the initial parser and Linux CI, independent of host GPU.
[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["app", "scripts", "tests"]
extend-exclude = ["data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Tests import the repository modules as `scripts.*`; keep the repository root
# importable regardless of how pytest is launched.
pythonpath = ["."]
addopts = "-q"
