name: "Bug / 缺陷"
description: "报告可复现的行为错误、证据不一致或数据问题"
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: repro
    attributes:
      label: "复现步骤"
      description: "提供执行命令和精简输入（勿包含密钥、客户数据或厂商原文）"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "期望行为与实际结果"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "运行环境与数据/模型版本"
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: "安全检查"
      options:
        - label: "我已移除密钥、内部工单、个人信息以及无授权原文。"
          required: true
