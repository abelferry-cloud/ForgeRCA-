name: Validate local services

on:
  push:
    paths:
      - compose.yaml
      - .env.example
      - tests/test_compose.py
      - justfile
      - pyproject.toml
      - uv.lock
      - tests/test_dev_commands.py
      - versions.lock.json
      - config/opensearch/**
      - tests/test_version_lock.py
      - .github/workflows/compose.yml
  pull_request:
    paths:
      - compose.yaml
      - .env.example
      - tests/test_compose.py
      - justfile
      - pyproject.toml
      - uv.lock
      - tests/test_dev_commands.py
      - versions.lock.json
      - config/opensearch/**
      - tests/test_version_lock.py
      - .github/workflows/compose.yml

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.12"
      - name: Install locked dev tools and check commands
        run: |
          uv sync --frozen
          uv run --frozen python -m unittest discover -s tests -p test_dev_commands.py -v
          uv run --frozen python -m unittest discover -s tests -p test_version_lock.py -v
      - name: Prepare temporary credentials
        shell: bash
        run: |
          pg_pass=$(openssl rand -hex 24)
          neo4j_pass=$(openssl rand -hex 24)
          echo "::add-mask::$pg_pass"
          echo "::add-mask::$neo4j_pass"
          echo "POSTGRES_PASSWORD=$pg_pass" >> "$GITHUB_ENV"
          echo "NEO4J_PASSWORD=$neo4j_pass" >> "$GITHUB_ENV"
      - name: Check interpolation and start services
        run: |
          python -m unittest discover -s tests -p test_compose.py -v
          sudo sysctl -w vm.max_map_count=262144
          docker compose config --quiet
          uv run --frozen just up
          docker compose ps
      - name: Validate the locked mapping with synthetic vectors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          lock = json.loads(Path('versions.lock.json').read_text())
          spec = json.loads(Path(lock['opensearch_mapping']['path']).read_text())
          base = 'http://127.0.0.1:9200/version-lock-smoke'

          def request(path, payload=None):
              body = json.dumps(payload).encode() if payload is not None else None
              req = Request(base + path, data=body, method='PUT' if body else 'GET',
                            headers={'Content-Type': 'application/json'})
              with urlopen(req, timeout=30) as response:
                  return json.load(response)

          assert request('', spec)['acknowledged']
          actual = request('/_mapping')['version-lock-smoke']['mappings']
          assert actual == spec['mappings'], actual
          doc = {'evidence_id': 'synthetic-version-smoke',
                 'embedding': [1.0] + [0.0] * (lock['embedding']['dimension'] - 1)}
          assert request('/_doc/1', doc)['result'] == 'created'
          assert request('/_doc/1')['_source'] == doc
          for invalid in ({**doc, 'embedding': [1.0, 0.0]}, {**doc, 'undeclared': 'value'}):
              try:
                  request('/_doc/invalid', invalid)
              except HTTPError as error:
                  assert error.code == 400, error.read()
              else:
                  raise AssertionError('Invalid vector or undeclared field was accepted')
          print('Locked mapping accepted; vector size and strict fields enforced')
          PY
      - name: Write disposable records
        run: |
          docker compose exec -T postgres psql -U forgerca -d forgerca -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE compose_smoke (value text); INSERT INTO compose_smoke VALUES ('persisted');"
          curl --fail --silent --show-error -X PUT http://127.0.0.1:9200/compose-smoke/_doc/1 \
            -H 'Content-Type: application/json' -d '{"value":"persisted"}'
          echo "CREATE (:ComposeSmoke {value: 'persisted'});" | docker compose exec -T neo4j sh -c \
            'cypher-shell -u "$HEALTH_USER" -p "$HEALTH_PASSWORD"'
          curl --fail --silent --show-error http://127.0.0.1:7474/ > /dev/null
      - name: Recreate containers and verify persisted records
        run: |
          uv run --frozen just down
          uv run --frozen just up
          docker compose exec -T postgres psql -U forgerca -d forgerca -Atc \
            'SELECT value FROM compose_smoke;' | grep -Fx persisted
          curl --fail --silent --show-error http://127.0.0.1:9200/compose-smoke/_doc/1 \
            | python -c 'import json, sys; assert json.load(sys.stdin)["_source"]["value"] == "persisted"'
          docker compose exec -T neo4j sh -c \
            'cypher-shell -u "$HEALTH_USER" -p "$HEALTH_PASSWORD" --format plain "MATCH (n:ComposeSmoke) RETURN n.value;"' \
            | grep -Fx '"persisted"'
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 80
      - name: Remove disposable containers and volumes
        if: always()
        run: docker compose down --volumes
